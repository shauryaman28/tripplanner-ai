# What runs on every push (Phase 28): is this commit fit to merge — and, on main, deploy it.
#
#   backend    lint, the alert rules, the migrations, the unit and contract tests   aim: under 2 minutes
#   frontend   types, lint, a production build                              aim: under 3 minutes
#   deploy     only on main, only after both: .github/workflows/deploy.yml
#
# Two jobs, side by side, and not five. In a private repository every job is billed as whole minutes
# of a monthly allowance, so a job that takes twenty seconds costs a minute: lint, migrations and tests
# share one checkout and one install. They are the two checks to require on main (Settings → Branches).
#
# `push` only. A pull request's commits are pushed commits, and are checked as that; listening for
# pull requests as well ran everything twice — and left two checks of the same name on one commit, one of
# which could be "skipped", which a required check counts as passed.
name: CI

on:
  push:
    branches: ["**"]

# A newer push to a branch makes the run of the older one pointless. Not on main: every merge is finished,
# because the last step there is a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # The migrations are checked against a real Postgres with pgvector: `alembic check` compares the
      # models with a database, and the first migration creates the extension.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tripplanner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tripplanner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripplanner -d tripplanner_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install — exactly the versions that are deployed
        # -c constraints.txt: what is tested here is what the image installs (Phase 27)
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Alert rules — promtool and amtool, at the stack's own versions
        # Phase 34: each alert of docker/observability/alerts/rules.yml fired on purpose from series written by
        # hand, and kept quiet where it must be (tests.yml); Alertmanager's config read the way it reads it.
        run: |
          docker run --rm -v "$PWD/docker/observability:/w:ro" --entrypoint promtool prom/prometheus:v3.15.0 check rules /w/alerts/rules.yml
          docker run --rm -v "$PWD/docker/observability:/w:ro" --entrypoint promtool prom/prometheus:v3.15.0 test rules /w/alerts/tests.yml
          docker run --rm -v "$PWD/docker/observability:/w:ro" --entrypoint amtool prom/alertmanager:v0.34.1 check-config /w/alertmanager.yml

      - name: Migrations — every one applies, the models say nothing they do not, and they come down again
        env:
          DATABASE_URL: postgresql://tripplanner:ci-only-password@localhost:5432/tripplanner_ci
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Unit + contract tests
        run: pytest tests/unit/ tests/contract/ -v

      # Integration tests (real Postgres + Redis) and the browser suite run every night, not on every push:
      # .github/workflows/nightly.yml. By hand:
      #   RUN_INTEGRATION=1 pytest tests/integration/
      #   cd src/frontend && npx playwright test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install — exactly what the lock file says
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  deploy:
    name: deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
