services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tripplanner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner_secret
      POSTGRES_DB: tripplanner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tripplanner -d tripplanner_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tripplanner_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: run the backend in Docker.
  # During development, prefer running locally (from the repo root):
  #   pip install -r requirements.txt && alembic upgrade head
  #   uvicorn app.main:app --reload --app-dir src/backend
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: tripplanner_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the services are reached by name, not localhost.
      DATABASE_URL: postgresql://tripplanner:tripplanner_secret@postgres:5432/tripplanner_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app/src/backend
      - ./src/ai:/app/src/ai
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --app-dir src/backend --host 0.0.0.0 --port 8000
             --reload --reload-dir src/backend --reload-dir src/ai"

volumes:
  postgres_data:
  redis_data:
