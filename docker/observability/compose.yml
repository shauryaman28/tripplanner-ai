# The observability stack on this machine (Phase 29): where the app's metrics, traces and log
# lines go, and where they are looked at. Phase 34: and who is told when something is wrong.
#
#     python scripts/observability.py up        # this file, started and waited for
#
#     Grafana        http://localhost:3001      the dashboard, and Explore for the log lines — no login
#     Prometheus     http://localhost:9090      reads GET /metrics of the backend every 5 s; evaluates the
#                                               alerts (alerts/rules.yml) — Alerts, at /alerts
#     Alertmanager   http://localhost:9093      what fires, grouped and sent on (alertmanager.yml); silences
#     alert receiver http://localhost:9011      where it is sent: prints each alert, keeps them at /alerts
#     Jaeger         http://localhost:16686     the traces; takes them as OTLP on http://localhost:4318
#     Loki           http://localhost:3110      the log lines (3100 is taken: the browser tests' web server)
#     Alloy                                     reads the log lines and sends them to Loki
#
# Nothing here is in the app's path: with the stack down the app runs exactly as before, minus
# anyone looking. Two of the five need the app told about them — where to send traces
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318) and to log JSON (LOG_FORMAT=json): HOW_TO_RUN.md, Step 27.
#
# For looking at one machine. No passwords, nothing kept beyond a week, traces in memory: not a
# production setup, and not meant as one.
name: tripplanner-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.external-url=http://localhost:9090 # an alert's "source" link opens here, not at the container's name
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro # Phase 34: the alert rules (and their tests, which Prometheus ignores)
      # the production-like backend's operations token, written by scripts/observability.py (git-ignored)
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # the backend runs on the host, or publishes its port there
    depends_on:
      - alertmanager

  # Phase 34: what Prometheus says fires goes here, and is sent on — grouped, repeated, said when it stops.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - alert-receiver

  # …and where Alertmanager sends it on this machine: a stand-in for Slack or a pager, which prints each
  # alert (`python scripts/observability.py logs -f alert-receiver`) and keeps them for the drill to read.
  alert-receiver:
    image: python:3.11-slim # the app's own base image (src/backend/Dockerfile): nothing new to pull
    command: ["python", "-u", "/receiver/alert_receiver.py", "--host", "0.0.0.0", "--port", "9011"]
    volumes:
      - ../../scripts/alert_receiver.py:/receiver/alert_receiver.py:ro
    ports:
      - "9011:9011"

  jaeger:
    # Jaeger 2: the all-in-one configuration it starts with by default — traces kept in memory.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # the UI, and the API the check script asks
      - "4318:4318" # OTLP over HTTP: where the app sends its spans

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3110:3100"

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # the log lines of the app's containers (the production-like backend)…
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # …and of a backend run on the host: its output, written into ./logs (HOW_TO_RUN.md, Step 27)
      - ../../logs:/var/log/tripplanner:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # a dashboard on one's own machine: open it and look
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tripplanner.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000" # 3000 is the frontend's
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  prometheus-data:
