[databases]
tripplanner = host=neon-standin port=5432 dbname=tripplanner

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; The two things that make a pooler a pooler. A server connection is lent for one transaction…
pool_mode = transaction
; …and what a client prepared on it is gone when it is given back. A hosted pooler may keep track of
; prepared statements for its clients (max_prepared_statements > 0); this one, like many, does not —
; and wipes the connection after every transaction, so that code which counts on one fails every
; time and not one time in ten.
max_prepared_statements = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 1
; Phase 30: as many server connections as the pooler this one stands in for lends — Neon's is 90 % of
; its Postgres's max_connections, 94 on the smallest. (It was 4 until a load test: enough for the one
; plan at a time this stack had ever made, and the first thing to run out under more.) The Postgres
; behind it allows 100; the rest are for what goes around the pooler — the migrations, a health check.
default_pool_size = 90
max_client_conn = 200

; Phase 30: the stack's own user may ask the pooler how it is doing — SHOW POOLS, SHOW STATS — and
; nothing else. That is how a load test sees clients waiting for a server connection (cl_waiting).
stats_users = tripplanner

; Phase 32: after it has failed to reach Postgres, how long the pooler waits before it tries again —
; and refuses its clients meanwhile. PgBouncer's default is 15 seconds: with Postgres killed and back
; within three, the app could not use it for another twelve (docs/chaos-data-report.md). What a hosted
; pooler waits is its operator's choice, and is not this file's to say; here, 5.
server_login_retry = 5

; TLS on both sides: required of the client, used towards the server.
client_tls_sslmode = require
client_tls_cert_file = /certs/server.crt
client_tls_key_file = /certs/server.key
server_tls_sslmode = require

ignore_startup_parameters = extra_float_digits,options
