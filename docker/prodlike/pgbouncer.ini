[databases]
tripplanner = host=neon-standin port=5432 dbname=tripplanner

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; The two things that make a pooler a pooler. A server connection is lent for one transaction…
pool_mode = transaction
; …and what a client prepared on it is gone when it is given back. A hosted pooler may keep track of
; prepared statements for its clients (max_prepared_statements > 0); this one, like many, does not —
; and wipes the connection after every transaction, so that code which counts on one fails every
; time and not one time in ten.
max_prepared_statements = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 1
default_pool_size = 4
max_client_conn = 200

; TLS on both sides: required of the client, used towards the server.
client_tls_sslmode = require
client_tls_cert_file = /certs/server.crt
client_tls_key_file = /certs/server.key
server_tls_sslmode = require

ignore_startup_parameters = extra_float_digits,options
